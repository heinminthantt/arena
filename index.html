<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberShield Arena: Demo</title>
<style>
  :root{
    --bg:#0b1226; --panel:#131c3a; --panel2:#1a2650; --ink:#f4f7ff; --muted:#a9b6dd;
    --blue:#3d8bff; --green:#2fd67c; --red:#ff5a6e; --gold:#ffc94d; --line:#2a3a75;
    --radius:22px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:"Segoe UI", system-ui, "Noto Sans Myanmar", "Myanmar Text", sans-serif;}
  button{font-family:inherit; cursor:pointer; border:none; color:var(--ink);}
  .app{display:flex; min-height:100vh;}

  /* Sidebar navigation: every section, one tap, always visible */
  .side{width:300px; flex:0 0 300px; background:var(--panel); border-right:2px solid var(--line);
    padding:20px 16px; display:flex; flex-direction:column; gap:10px; position:sticky; top:0; height:100vh; overflow:auto;}
  .brand{display:flex; align-items:center; gap:12px; padding:6px 4px 14px;}
  .brand img{width:64px; height:64px; object-fit:cover; border-radius:16px; background:#fff;}
  .brand h1{font-size:24px; margin:0; line-height:1.15;}
  .brand small{color:var(--muted); font-size:14px;}
  .badge{display:inline-block; padding:4px 12px; border-radius:999px; font-size:14px; font-weight:700; letter-spacing:.4px;}
  .badge.demo{background:var(--gold); color:#231a00;}
  .badge.backup{background:#44507e; color:#dbe4ff;}
  .navbtn{display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    background:var(--panel2); border:2px solid transparent; border-radius:16px;
    padding:16px 14px; font-size:21px; font-weight:600; min-height:64px;}
  .navbtn .n{font-size:24px;}
  .navbtn.active{border-color:var(--blue); background:#22336e;}
  .navbtn:active{transform:scale(.98);}
  .side .spacer{flex:1;}
  .langrow{display:flex; gap:8px;}
  .langbtn{flex:1; padding:14px; font-size:19px; border-radius:14px; background:var(--panel2); font-weight:700; min-height:56px;}
  .langbtn.active{background:var(--blue);}
  .resetbtn{padding:14px; font-size:17px; border-radius:14px; background:#3a1622; color:#ffb3bd; font-weight:700; min-height:56px;}

  /* Main column */
  .main{flex:1; min-width:0; padding:22px 28px 40px;}
  .scorebar{display:flex; gap:16px; align-items:stretch; margin-bottom:20px; flex-wrap:wrap;}
  .score{flex:1; min-width:260px; background:var(--panel); border:2px solid var(--line); border-radius:var(--radius);
    padding:14px 22px; display:flex; align-items:center; justify-content:space-between;}
  .score .who{font-size:22px; color:var(--muted); font-weight:700;}
  .score .pts{font-size:56px; font-weight:800; line-height:1;}
  .score.students .pts{color:var(--green);} .score.ai .pts{color:var(--blue);}
  .score .adj{display:flex; gap:8px;}
  .adj button{width:56px; height:56px; border-radius:14px; font-size:26px; font-weight:800; background:var(--panel2);}
  .usage{background:var(--panel); border:2px solid var(--line); border-radius:var(--radius);
    padding:14px 22px; font-size:18px; color:var(--muted); display:flex; align-items:center; gap:10px;}
  .usage b{color:var(--ink); font-size:22px;}

  .page{display:none;} .page.show{display:block;}
  .page h2{font-size:46px; margin:4px 0 6px;}
  .page .sub{font-size:22px; color:var(--muted); margin:0 0 20px; line-height:1.7;}
  .card{background:var(--panel); border:2px solid var(--line); border-radius:var(--radius); padding:26px; margin-bottom:18px;}
  .bigmsg{font-size:34px; line-height:1.75; background:#0e1734; border:2px dashed var(--line);
    border-radius:18px; padding:24px; white-space:pre-wrap;}
  .row{display:flex; gap:14px; flex-wrap:wrap; align-items:center;}
  .bigbtn{min-height:76px; padding:18px 30px; font-size:25px; font-weight:800; border-radius:18px; background:var(--panel2);}
  .bigbtn.primary{background:var(--blue);} .bigbtn.green{background:#0f7a44;} .bigbtn.red{background:#a11f31;}
  .bigbtn.gold{background:#8a6410;} .bigbtn:active{transform:scale(.98);}
  .bigbtn:disabled{opacity:.45; cursor:default;}
  .verdict{font-size:40px; font-weight:900; padding:10px 0;}
  .verdict.scam{color:var(--red);} .verdict.safe{color:var(--green);}
  .flags{font-size:23px; line-height:1.75; margin:8px 0 0 22px;}
  .explain{font-size:23px; line-height:1.75; color:#dbe4ff;}
  .dots{display:flex; gap:10px; margin:14px 0;}
  .dot{width:52px; height:52px; border-radius:50%; background:var(--panel2); font-size:20px; font-weight:800;
    display:flex; align-items:center; justify-content:center; border:2px solid transparent;}
  .dot.cur{border-color:var(--gold);} .dot.done{background:#0f7a44;}
  input[type=text], input[type=password], textarea{width:100%; background:#0e1734; color:var(--ink);
    border:2px solid var(--line); border-radius:16px; padding:18px; font-size:25px; font-family:inherit;}
  textarea{min-height:110px; resize:vertical;}
  .meter{height:30px; background:#0e1734; border-radius:999px; overflow:hidden; border:2px solid var(--line);}
  .meter > div{height:100%; width:0%; transition:width .4s;}
  .history{display:flex; flex-direction:column; gap:12px;}
  .histitem{background:#0e1734; border:2px solid var(--line); border-radius:16px; padding:16px 20px; font-size:21px; line-height:1.7;}
  .histitem .q{font-weight:800;}
  .histitem .meta{color:var(--muted); font-size:16px; margin-top:6px;}
  .tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px;}
  .tile{background:var(--panel); border:2px solid var(--line); border-radius:var(--radius); padding:24px; text-align:left; width:100%;}
  .tile .n{font-size:44px;} .tile h3{font-size:27px; margin:10px 0 6px;} .tile p{font-size:19px; color:var(--muted); margin:0; line-height:1.65;}
  .tile .st{margin-top:12px; font-size:17px; font-weight:700; color:var(--gold);}
  .hero{display:flex; gap:26px; align-items:center; flex-wrap:wrap;}
  .hero img{width:230px; height:230px; object-fit:cover; border-radius:26px; background:#fff;}
  .hero h2{font-size:58px; margin:0 0 8px;}
  .hero p{font-size:24px; color:var(--muted); margin:0; max-width:640px; line-height:1.7;}
  table{width:100%; border-collapse:collapse; font-size:19px;}
  th,td{border-bottom:1px solid var(--line); padding:12px 10px; text-align:left; vertical-align:top;}
  th{color:var(--muted); font-size:17px; text-transform:uppercase; letter-spacing:.5px;}
  .pill{display:inline-block; padding:3px 12px; border-radius:999px; background:var(--panel2); font-size:16px; font-weight:700;}
  .note{font-size:19px; color:var(--gold); line-height:1.55;}
  .thinking{font-size:24px; color:var(--gold); font-weight:700;}
  .levelrow{display:flex; gap:10px; flex-wrap:wrap;}
  .lvl{min-height:64px; padding:14px 22px; font-size:21px; font-weight:800; border-radius:16px; background:var(--panel2);}
  .lvl.active{background:var(--blue);}
  @media (max-width:900px){
    .app{flex-direction:column;} .side{width:100%; flex:none; height:auto; position:static;}
    .page h2{font-size:36px;} .hero h2{font-size:40px;}
  }
</style>
<style id="pixor-theme">
/* Pixor inspired theme: light cream base, ink borders, hard block shadows, lime + sky blue, voxel assets.
   Palette and fonts sampled from pixor.framer.website source: ink #1b1b21, blue rgb(0,153,255),
   lime #bdf164 / #83ca16, cream #f9f5ec, pastels #eef5fe #f6fde6 #ffe1e3 #fed8aa, Inter / Instrument Sans. */
:root{
  --bg:#f7f7f5; --panel:#ffffff; --panel2:#eef5fe; --ink:#1b1b21; --muted:#44454c;
  --line:#1b1b21; --blue:#0099ff; --green:#64a20d; --red:#d92d20; --gold:#f5b301; --radius:22px;
}
body{background:var(--bg); color:var(--ink);}
.side{background:#ffffff; border-right:3px solid var(--ink);}
.brand img{border:none; border-radius:16px;}
.brand h1{letter-spacing:-.02em;}
.badge.demo{background:#fed8aa; color:var(--ink); border:2px solid var(--ink);}
.score{background:#ffffff; border:2.5px solid var(--ink); box-shadow:0 6px 0 var(--ink);}
.score .pts.students{color:#4d7b0f;} .score .pts.ai{color:#0077cc;}
.score .plus button{background:#ffffff; color:var(--ink); border:2px solid var(--ink); box-shadow:0 3px 0 var(--ink);}
.score .plus button:active{transform:translateY(2px); box-shadow:0 1px 0 var(--ink);}
.navbtn{background:#ffffff; color:var(--ink); border:2.5px solid var(--ink); border-radius:12px; box-shadow:0 4px 0 var(--ink); font-weight:700;}
.navbtn.active{background:#c2f53a; border-color:var(--ink); color:var(--ink); box-shadow:0 4px 0 var(--ink);}
.navbtn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--ink);}
.navimg{width:40px; height:40px; object-fit:contain; border-radius:10px;}
.langbtn,.resetbtn{background:#ffffff; color:var(--ink); border:2.5px solid var(--ink); border-radius:12px; box-shadow:0 3px 0 var(--ink); font-weight:700;}
.langbtn:active,.resetbtn:active{transform:translateY(2px); box-shadow:0 1px 0 var(--ink);}
.resetbtn{color:#b3261e;}
main h2{letter-spacing:-.03em; font-weight:800;}
.card{background:#ffffff; border:2.5px solid var(--ink); box-shadow:0 7px 0 var(--ink);}
.hero{background:#ffffff; align-items:center;}
.heroset{position:relative; width:320px; height:270px; flex:0 0 auto;}
.heromain{width:240px; height:240px; object-fit:contain; position:absolute; left:30px; top:8px;}
.floaty{position:absolute; object-fit:contain; animation:floaty 3.6s ease-in-out infinite;}
.floaty.f1{width:92px; height:92px; right:-6px; top:-8px; animation-delay:.4s;}
.floaty.f2{width:84px; height:84px; left:-14px; bottom:-6px; animation-delay:1.1s;}
.floaty.f3{width:88px; height:88px; right:2px; bottom:-10px; animation-delay:1.8s;}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.marquee{background:#1b1b21; color:#c2f53a; border:2.5px solid var(--ink); border-radius:16px; overflow:hidden; margin:20px 0 4px; box-shadow:0 5px 0 rgba(27,27,33,.35);}
.mtrack{display:flex; width:max-content; animation:marq 22s linear infinite; font-weight:800; font-size:20px; letter-spacing:.06em; padding:10px 0; white-space:nowrap;}
@keyframes marq{to{transform:translateX(-50%)}}
.tile{background:#ffffff; color:var(--ink); border:2.5px solid var(--ink); border-radius:22px; box-shadow:0 7px 0 var(--ink); transition:transform .15s ease, box-shadow .15s ease;}
.tiles .tile:nth-child(4n+1){background:#fce8e6;}
.tiles .tile:nth-child(4n+2){background:#e2edfb;}
.tiles .tile:nth-child(4n+3){background:#ddf3df;}
.tiles .tile:nth-child(4n){background:#fff2bc;}
.tile:hover{transform:translateY(-2px); box-shadow:0 10px 0 var(--ink);}
.tile:active{transform:translateY(4px); box-shadow:0 2px 0 var(--ink);}
.tile h3{color:var(--ink); letter-spacing:-.01em;} .tile p{color:var(--muted);}
.tileimg{height:112px; width:112px; object-fit:contain;}
.tile .st{background:#eafac9; color:#0d2900; border:2px solid var(--ink); font-weight:700;}
.dot{background:#ffffff; color:var(--ink); border:2.5px solid var(--ink); font-weight:800;}
.dot.cur{background:#0099ff; color:#ffffff; border-color:var(--ink);}
.dot.done{background:#c2f53a; color:var(--ink);}
.bigmsg{background:#eef5fe; border:2.5px solid var(--ink); color:var(--ink);}
input[type=text],input[type=password],textarea{background:#ffffff; color:var(--ink); border:2.5px solid var(--ink); border-radius:16px;}
.bigbtn{border:2.5px solid var(--ink); border-radius:14px; box-shadow:0 6px 0 var(--ink); letter-spacing:.01em;}
.bigbtn:active{transform:translateY(4px); box-shadow:0 2px 0 var(--ink);}
.bigbtn.primary{background:#0099ff; color:#ffffff;}
.bigbtn.good{background:#9bea2b; color:var(--ink);}
.bigbtn.bad{background:#ffa7ad; color:var(--ink);}
.bigbtn.ghost{background:#ffffff; color:var(--ink);}
.smallbtn{background:#ffffff; color:var(--ink); border:2px solid var(--ink); border-radius:10px; box-shadow:0 3px 0 var(--ink); font-weight:700;}
.verdict.good{color:#4d7b0f; background:#eafac9; border:2.5px solid #4d7b0f;}
.verdict.bad{color:#b3261e; background:#ffe1e3; border:2.5px solid #b3261e;}
.explain{background:#f6fde6; border:2px solid var(--ink); border-left:10px solid #83ca16; color:var(--ink);}
.histitem,.logitem{background:#f9f5ec; border:2px solid #e0e2e6; color:var(--ink);}
.histitem .q{color:var(--ink);} .histitem .meta,.logitem .meta{color:var(--muted);}
.meter{background:#ffffff; border:2.5px solid var(--ink);}
.meter i{background:linear-gradient(90deg,#bdf164,#83ca16);}
.note{color:#7a4b00;} .hint{color:var(--muted);}
table th{color:var(--muted); border-bottom:2.5px solid var(--ink);}
table td{border-bottom:2px solid #e0e2e6; color:var(--ink);}
:focus-visible{outline:4px solid #0099ff; outline-offset:2px;}
@media (prefers-reduced-motion: reduce){ .floaty,.mtrack{animation:none;} }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <img src="asset-shield.webp" alt="CyberShield Arena shield">
      <div>
        <h1 id="brandTitle">CyberShield Arena</h1>
        <small id="brandSub">Students vs AI</small><br>
        <span class="badge demo" id="modeBadge">DEMO: API NOT CONNECTED</span>
      </div>
    </div>
    <div id="nav"></div>
    <div class="spacer"></div>
    <div class="langrow">
      <button class="langbtn" id="langEn">EN</button>
      <button class="langbtn" id="langMy">မြန်မာ</button>
    </div>
    <button class="resetbtn" id="resetBtn">Reset all records</button>
  </aside>

  <main class="main">
    <div class="scorebar">
      <div class="score students">
        <div><div class="who" data-i="students">Students</div><div class="pts" id="ptsStudents">0</div></div>
        <div class="adj">
          <button id="stuMinus" aria-label="Students minus">−</button>
          <button id="stuPlus" aria-label="Students plus">+</button>
        </div>
      </div>
      <div class="score ai">
        <div><div class="who">AI</div><div class="pts" id="ptsAi">0</div></div>
        <div class="adj">
          <button id="aiMinus" aria-label="AI minus">−</button>
          <button id="aiPlus" aria-label="AI plus">+</button>
        </div>
      </div>
      <div class="usage"><span data-i="usage">Demo calls</span> <b id="usageCalls">0</b>
        <span>·</span> <span data-i="tokens">Est. tokens</span> <b id="usageTokens">0</b>
        <span>·</span> <span class="badge backup">BACKUP ANSWERS</span></div>
    </div>

    <section class="page" id="page-home"></section>
    <section class="page" id="page-scam"></section>
    <section class="page" id="page-vault"></section>
    <section class="page" id="page-roast"></section>
    <section class="page" id="page-ask"></section>
    <section class="page" id="page-quiz"></section>
    <section class="page" id="page-records"></section>
  </main>
</div>
<script>
"use strict";
/* ============================================================
   CyberShield Arena: DEMO build
   Everything works except the live Claude API.
   To connect the API later, only replace the body of
   Api.call() below with a fetch to your server route.
   The rest of the app never changes.
   ============================================================ */
const Api = {
  mode: "demo",               // later: "live"
  endpoint: null,             // later: "/api/..." on your server
  async call(route, payload) {
    // DEMO ONLY: simulates the API with saved answers and local rules.
    await new Promise(r => setTimeout(r, 650));
    const out = MockBrain.answer(route, payload);
    out.source = "backup";
    out.usage = { input: 320 + JSON.stringify(payload).length, output: 180 };
    return out;
  }
};

/* ---------- i18n ---------- */

/* ---------- Ask the Hacker: saved answers (demo) ---------- */
function askAnswer(q, lang){
  const s = q.toLowerCase();
  const bad = ["hack into", "steal password", "break into", "malware", "phishing kit", "ခိုးဝင်", "စကားဝှက် ခိုး"];
  if (bad.some(w => s.includes(w))) return lang === "my"
    ? "အဲ့ဒါကို ကျွန်တော် မကူညီနိုင်ပါ။ ဒါပေမယ့် ကာကွယ်နည်းကို ပြောပြနိုင်တယ်: Password ခိုင်ခိုင်ထားပါ၊ 2FA ဖွင့်ပါ၊ မသိတဲ့ လင့်ခ် မနှိပ်ပါနဲ့။"
    : "I cannot help with that. But I can teach the defense: use a strong passphrase, turn on 2FA, and never click unknown links.";
  if (s.includes("password") || s.includes("စကားဝှက်")) return lang === "my"
    ? "အရင်ဆုံး သန့်ရှင်းတဲ့ စက်ကနေ Password ပြောင်းပါ။ ပြီးရင် 2FA ဖွင့်ပါ။ နောက်ဆုံး တခြား session အားလုံး log out လုပ်ပါ။"
    : "First, change the password from a clean device. Second, turn on two-factor authentication. Third, log out all other sessions.";
  if (s.includes("phishing") || s.includes("scam") || s.includes("လိမ်လည်")) return lang === "my"
    ? "Phishing ဆိုတာ သင့် Password ဒါမှမဟုတ် ငွေကို လှည့်ပြီး ယူဖို့ လုပ်ထားတဲ့ မက်ဆေ့ အတု ဒါမှမဟုတ် Login စာမျက်နှာ အတုပါ။"
    : "Phishing is a fake message or fake login page that tricks you into giving away your password or money.";
  if (s.includes("otp") || s.includes("code") || s.includes("ကုဒ်")) return lang === "my"
    ? "OTP ကို ဘယ်သူ့ကိုမှ မပေးပါနဲ့။ ဘဏ်ကလည်း ဖုန်းဆက်ပြီး OTP ဘယ်တော့မှ မတောင်းပါ။"
    : "Never share an OTP with anyone. A real bank will never call and ask for it.";
  if (s.includes("wi-fi") || s.includes("wifi")) return lang === "my"
    ? "မသိတဲ့ အခမဲ့ Wi-Fi မှာ ဘဏ် ဒါမှမဟုတ် အီးမေးလ် မဝင်ပါနဲ့။ ကိုယ့် mobile data က ပိုလုံခြုံတယ်။"
    : "Never log in to banking or email on unknown free Wi-Fi. Your own mobile data is safer.";
  if (s.includes("photo") || s.includes("ဓာတ်ပုံ")) return lang === "my"
    ? "ဓာတ်ပုံတွေမှာ တည်နေရာ အချက်အလက် ပါနိုင်တယ်။ မတင်ခင် location tagging ပိတ်ပါ၊ တည်နေရာ ဖြုတ်ပါ။"

      let won = false, reply = "";

function pwScore(pw) {
  let s = 0;
  if (pw.length >= 8) s += 1; if (pw.length >= 12) s += 1; if (pw.length >= 16) s += 1;
  if (/[a-z]/.test(pw) && /[A-Z]/.test(pw)) s += 1;
  if (/\d/.test(pw)) s += 0; if (/[^A-Za-z0-9]/.test(pw)) s += 1;
  if (/(123|abc|qwerty|password|1234)/i.test(pw)) s -= 2;
  if (/^[a-z]+\d{2,4}!?$/i.test(pw)) s -= 1;
  return Math.max(0, Math.min(4, s));
}

/* ---------- Wiring ---------- */
function applyLang() {
  document.querySelectorAll("[data-i]").forEach(el => { el.textContent = t(el.dataset.i); });
  document.getElementById("langEn").classList.toggle("active", S.lang === "en");
  document.getElementById("langMy").classList.toggle("active", S.lang === "my");
  renderNav(); renderScore(); renderPage(S.page);
  document.querySelectorAll(".navbtn").forEach(b => b.classList.toggle("active", b.dataset.page === S.page));
}
document.getElementById("langEn").onclick = () => { S.lang = "en"; log(S.page, "language", "EN"); save(); applyLang(); };
document.getElementById("langMy").onclick = () => { S.lang = "my"; log(S.page, "language", "MY"); save(); applyLang(); };
document.getElementById("resetBtn").onclick = () => {
  if (confirm("Reset all scores, progress and records?")) { S = freshState(); save(); applyLang(); go("home"); }
};
const adj = (who, d) => () => { S.scores[who] = Math.max(0, S.scores[who] + d); log("home", "score adjust", who + " " + (d > 0 ? "+1" : "-1")); save(); renderScore(); };
document.getElementById("stuPlus").onclick = adj("students", 1);
document.getElementById("stuMinus").onclick = adj("students", -1);
document.getElementById("aiPlus").onclick = adj("ai", 1);
document.getElementById("aiMinus").onclick = adj("ai", -1);
applyLang();
go(S.page || "home");
</script>
</body>
</html>
